name: fortivex-voice
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: fortivex_voice
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - sales_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk -d fortivex_voice"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  sales_data:
