<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowDesk Sales Assistant</title>
  <link rel="stylesheet" href="/assets/sales.css">
  <script src="/assets/sales.js" defer></script>
</head>
<body>
  <header><strong>FlowDesk</strong><span>Sales assistant</span><a href="/architecture.html">Architecture</a></header>
  <main>
    <h1>Product discovery and demo booking</h1>
    <p class="intro">Ask about FlowDesk, describe your team, and book a discovery demo.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <form id="login" class="card" hidden>
      <h2>Sign in to the demo</h2>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Sign in</button>
    </form>
    <div id="workspace" class="grid" hidden>
      <section class="card">
        <h2>Conversation</h2>
        <form id="start">
          <label>Language
            <select id="language"><option value="en">English</option><option value="hi">हिन्दी (Hindi)</option><option value="kn">ಕನ್ನಡ (Kannada)</option></select>
          </label>
          <label class="check"><input id="consent" type="checkbox" required> I understand microphone audio goes to Deepgram, product questions may go to Groq, and reply text goes to Rumik for speech. Use synthetic details only. The demo saves a summary in LeadPulse.</label>
          <button>Start conversation</button>
        </form>
        <div id="transcript" role="log" aria-live="polite"></div>
        <div id="controls" hidden>
          <div class="row"><button id="mic" type="button">Speak a turn</button><label class="check"><input id="speech" type="checkbox" checked> Speak replies</label><label class="check"><input id="autolisten" type="checkbox" checked> Auto-listen</label></div>
          <form id="typed">
            <label for="text">Type a turn</label>
            <div class="row"><input id="text" placeholder="What is the price?" maxlength="600" required><button>Send</button></div>
          </form>
          <button id="finish" class="quiet" type="button">Save without booking</button>
        </div>
      </section>
      <aside>
        <section class="card"><h2>Prospect details</h2><dl id="profile"></dl></section>
        <section class="card"><h2>Appointment</h2><div id="slots"><p>Ask to see available demo times.</p></div></section>
        <section class="card"><h2>LeadPulse record</h2><div id="saved"><p>The saved timeline will appear here.</p></div><button id="refresh" class="quiet" type="button" hidden>Refresh LeadPulse</button></section>
      </aside>
    </div>
  </main>
</body>
</html>
